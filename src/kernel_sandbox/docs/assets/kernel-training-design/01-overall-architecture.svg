<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">GPU Kernel Sandbox 总体架构</title>
  <desc id="desc">开发机上的kernel-sandbox提供HTTP API并管理CPU Pod和GPU Worker；GPU Worker内注入独立sandboxd二进制。</desc>
  <defs>
    <style>
      .title{font:700 34px Inter,Arial,"Noto Sans SC",sans-serif;fill:#14213d}.sub{font:500 16px Inter,Arial,"Noto Sans SC",sans-serif;fill:#64748b}.section{font:700 21px Inter,Arial,"Noto Sans SC",sans-serif;fill:#14213d}.head{font:700 18px Inter,Arial,"Noto Sans SC",sans-serif;fill:#172033}.text{font:500 15px Inter,Arial,"Noto Sans SC",sans-serif;fill:#334155}.small{font:500 13px Inter,Arial,"Noto Sans SC",sans-serif;fill:#64748b}.panel{fill:#fff;stroke:#d7e0ec;stroke-width:1.7}.blue{fill:#eff6ff;stroke:#5b91d1;stroke-width:1.8}.green{fill:#ecfdf5;stroke:#43a676;stroke-width:1.8}.purple{fill:#f5f3ff;stroke:#8b6ac6;stroke-width:1.8}.amber{fill:#fff8e8;stroke:#dca23c;stroke-width:1.8}.gray{fill:#f8fafc;stroke:#cbd5e1;stroke-width:1.5}.http{stroke:#477fc0;stroke-width:3;fill:none;marker-end:url(#blueArrow)}.control{stroke:#64748b;stroke-width:2.5;fill:none;marker-end:url(#grayArrow)}.exec{stroke:#d08d28;stroke-width:2.7;fill:none;stroke-dasharray:8 6;marker-end:url(#amberArrow)}
    </style>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#243b64" flood-opacity=".10"/></filter>
    <marker id="blueArrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#477fc0"/></marker>
    <marker id="grayArrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker>
    <marker id="amberArrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#d08d28"/></marker>
  </defs>

  <rect width="1600" height="900" fill="#f5f7fb"/>
  <text x="800" y="50" text-anchor="middle" class="title">GPU Kernel Sandbox 总体架构</text>
  <text x="800" y="80" text-anchor="middle" class="sub">kernel-sandbox-master 管理控制面；sandboxd 运行在 GPU Worker 内</text>

  <rect x="45" y="160" width="255" height="150" rx="18" class="blue" filter="url(#shadow)"/>
  <text x="172" y="205" text-anchor="middle" class="section">Agent / Trainer</text>
  <text x="172" y="241" text-anchor="middle" class="text">Session / command_exec</text>
  <text x="172" y="272" text-anchor="middle" class="small">HTTP :8765</text>

  <rect x="355" y="110" width="1200" height="410" rx="24" class="panel" filter="url(#shadow)"/>
  <text x="390" y="148" class="section">kernel-sandbox-master</text>
  <text x="390" y="176" class="small">HTTP 接入、内存状态、Kubernetes 管理和命令执行</text>

  <rect x="395" y="215" width="220" height="125" rx="16" class="green"/>
  <text x="505" y="252" text-anchor="middle" class="head">HTTP Server</text>
  <text x="505" y="281" text-anchor="middle" class="small">参数校验 · 生成 ID</text>
  <text x="505" y="307" text-anchor="middle" class="small">同步等待 Execution 结果</text>

  <rect x="665" y="195" width="270" height="165" rx="17" class="purple"/>
  <text x="800" y="234" text-anchor="middle" class="head">Master</text>
  <text x="800" y="266" text-anchor="middle" class="text">互斥锁保护内存状态</text>
  <text x="800" y="296" text-anchor="middle" class="small">状态流转 · GPU 调度</text>
  <text x="800" y="322" text-anchor="middle" class="small">重试 · timeout · Result</text>

  <rect x="985" y="215" width="205" height="125" rx="16" class="gray"/>
  <text x="1087" y="252" text-anchor="middle" class="head">内存状态</text>
  <text x="1087" y="281" text-anchor="middle" class="small">Pool · Session · Execution</text>
  <text x="1087" y="307" text-anchor="middle" class="small">Execution · GPU Queue</text>

  <rect x="1240" y="215" width="270" height="125" rx="16" class="green"/>
  <text x="1375" y="252" text-anchor="middle" class="head">Kubernetes Client</text>
  <text x="1375" y="281" text-anchor="middle" class="small">CPU / GPU Kubernetes Client</text>
  <text x="1375" y="307" text-anchor="middle" class="small">Create · Delete · List</text>

  <rect x="665" y="405" width="525" height="75" rx="15" class="amber"/>
  <text x="800" y="450" text-anchor="middle" class="head">Pod Executor</text>
  <text x="1055" y="450" text-anchor="middle" class="small">CPU direct · GPU sandboxd</text>

  <path d="M300 235 H395" class="http"/>
  <path d="M615 278 H665" class="control"/>
  <path d="M935 278 H985" class="control"/>
  <path d="M935 248 C1080 185 1170 185 1240 248" class="control"/>
  <path d="M800 360 V405" class="control"/>

  <rect x="120" y="590" width="620" height="235" rx="22" class="panel" filter="url(#shadow)"/>
  <text x="430" y="628" text-anchor="middle" class="section">CPU 集群</text>
  <text x="430" y="655" text-anchor="middle" class="small">cpu_gpu Session 创建普通 Pod</text>
  <rect x="180" y="690" width="500" height="95" rx="16" class="blue"/>
  <text x="430" y="726" text-anchor="middle" class="head">CPU Session Pod</text>
  <text x="430" y="754" text-anchor="middle" class="text">业务镜像 · Session 生命周期内保留文件状态</text>
  <text x="430" y="778" text-anchor="middle" class="small">固定 direct pods/exec；Pod 随 Session 保留</text>

  <rect x="860" y="590" width="620" height="235" rx="22" class="panel" filter="url(#shadow)"/>
  <text x="1170" y="628" text-anchor="middle" class="section">GPU 集群</text>
  <text x="1170" y="655" text-anchor="middle" class="small">一个 Deployment · replicas 个 Worker · 一 Pod 一 GPU</text>
  <rect x="920" y="690" width="500" height="95" rx="16" class="green"/>
  <text x="1170" y="726" text-anchor="middle" class="head">GPU Worker Pod × replicas</text>
  <text x="1170" y="754" text-anchor="middle" class="text">业务镜像 · 每条命令执行前后 GPU Check</text>
  <text x="1170" y="778" text-anchor="middle" class="small">共享 GPU Worker：sandboxd 复用，异常时删除补充</text>

  <path d="M1375 340 V550 H600 V590" class="control"/>
  <path d="M1375 340 V565 H1320 V590" class="control"/>
  <text x="990" y="552" text-anchor="middle" class="small">Kubernetes API</text>
  <path d="M800 480 V565 H430 V690" class="exec"/>
  <path d="M1055 480 V690" class="exec"/>
  <text x="760" y="582" text-anchor="middle" class="small">pods/exec</text>

  <rect x="510" y="852" width="580" height="30" rx="8" class="gray"/>
  <text x="800" y="873" text-anchor="middle" class="small">实线：HTTP / 内部事件 / Kubernetes API　　虚线：pods/exec 命令链路</text>
</svg>
