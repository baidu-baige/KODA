    - use the SAME `#include` set (`cute/tensor.hpp`, the two `collective/collective_builder.hpp`,
      `gemm/device/gemm_universal_adapter.h`, `gemm/kernel/gemm_universal.hpp`,
      `cutlass/util/packed_stride.hpp`) — do NOT invent header paths;
    - keep the `CollectiveBuilder` mainloop + epilogue typedefs and the `GemmUniversalAdapter` run sequence
      STRUCTURALLY unchanged; walk the precision ladder by changing ONLY the `ElementA/B/C/D` types (and
      their `Align*`), never the arch — `ElementAccumulator` stays `float` (fp32 acc = correctness);
    - transpose an operand by swapping ONLY its `LayoutA/B` typedef (RowMajor ↔ ColumnMajor); the strides
      are derived from it by `make_cute_packed_stride`, so leave the stride/`make_shape` calls alone.
      LAYOUT FOLLOWS THE REFERENCE'S MATH: first write down the EXACT expression the reference computes
      (`A @ B` vs `A @ B.T`), THEN pick the layout — never pick it from the operand's NAME. Torch tensors
      are RowMajor, so RowMajor is the DEFAULT for every operand used UNTRANSPOSED, and `ColumnMajor` is how
      (and the ONLY reason) you express a TRANSPOSE of that operand.
      * TRANSPOSED-B case — `x @ W.T`, i.e. `F.linear(x, W)` / `nn.Linear` forward, and ONLY this case:
        the weight `W[N, K]` (out_features × in_features, RowMajor) viewed as `[K, N]` is EXACTLY
        ColumnMajor, so feed `W` DIRECTLY as B by setting `LayoutB = ColumnMajor` and reading
        `N = W.size(0), K = W.size(1)`; the `make_cute_packed_stride(StrideB, make_shape(N, K, 1))` call
        stays UNCHANGED (only the Stride TYPE, derived from `LayoutB`, flips which of N/K is unit-stride).
        Do NOT hand-edit the `make_shape` args — just swap the layout typedef (the anchor's LAYOUT CONTRACT
        comment shows the one-line change).
      * COUNTEREXAMPLE where the rule above does NOT apply — a NON-transposed `@ weight`. `linear` BACKWARD
        is exactly this: `grad_hidden = grad_output @ weight` (NO `.T`) and `grad_weight = grad_output.T @
        hidden` (the transpose is on A, not B). There `weight` is already a plain `(K, N)` RowMajor B
        operand — KEEP `LayoutB = RowMajor` and read `K = weight.size(0), N = weight.size(1)`. Flipping it
        to ColumnMajor here silently computes `@ weight.T`: it COMPILES and RUNS but ~100% of the output
        elements are wrong (value mismatch, plus a shape mismatch when K != N). An operand named "weight"
        does NOT imply a transpose.
      The mis-config to avoid is a layout that CONTRADICTS the reference's math — RowMajor B where the
      reference transposes B, OR ColumnMajor B where it does not; both are common and both are silent at
      compile time, so re-read the reference expression before you set `LayoutB`. NOTE: for ColumnMajor B
      the alignment-constrained (contiguous) dim is K, not N — pad K (see the padding path below).
    - GATE the launch: `TORCH_CHECK(gemm.can_implement(args) == Status::kSuccess, ...)` and allocate the
      `get_workspace_size(args)` buffer ONCE — the wgmma path is alignment/shape-constrained (M,N,K and
      leading dims must satisfy the tile alignment).
    - ODD / UNALIGNED K IS COMMON on real ops (attention `head_dim`, projections with K not a multiple of
      the tile-K or the element alignment, e.g. K=2053). Do NOT let `can_implement` rejection dead-end the
      round and do NOT fall back to a scalar loop — take the PADDING PATH: round K up to the next multiple
      of the required alignment (`K_pad = ((K + a - 1)/a)*a`), allocate padded A (M×K_pad) and B (N×K_pad)
      ONCE, zero-fill the pad columns, copy the real K columns in, run the GEMM on K_pad, and read the M×N
      result unchanged. Because the pad is exact-zero it contributes 0 to every dot product, so D is
      bit-identical to the unpadded GEMM — no correctness cost, only the pad copy. Pad N/M the same way when
      those are the constrained dims, but slice the output back to the real M×N so padding never leaks into
      the downstream op. Keep the pad buffers preallocated (CUDA-graph-safe).
    ```cpp
