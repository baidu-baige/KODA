    HAND-WRITTEN CUDA SAFETY (a kernel that COMPILES can still score zero at eval on a memory fault — the
    biggest hand-written waste is `an illegal memory access was encountered` / `misaligned address` /
    `invalid argument`, each of which zeroes the round). Before you submit a hand-written kernel, check:
    - BOUNDS: every global load/store is guarded by an explicit index `< n` test (per dimension for 2D/3D
      grids). Compute the grid from the REAL sizes (`b = (n + t - 1)/t`) and never assume `n` is a multiple
      of the block; the tail block will read out of range otherwise. A shared-memory tile loaded past the
      row/col edge must be zero-padded, not read past the buffer.
    - ALIGNMENT: a vectorized access (`float4`/`half2`/`reinterpret_cast<float4*>`) requires the base
      pointer AND the index to be aligned to that width — `.contiguous()` the input and gate the vector
      path on `n % 4 == 0` (scalar-tail the remainder), or you get `misaligned address`.
    - LAUNCH CONFIG: `invalid argument` almost always means an illegal launch — `blockDim > 1024`, shared
      memory over the 227 KB/SM budget, a zero/negative grid dim, or a stream mismatch. Keep `blockDim`
      ≤ 1024 and size dynamic shared memory to what you actually requested.
    - Read the exact eval error string each round and fix THAT fault before touching performance.

    ## NVTX labels are how you ask for ncu metrics on a specific code region

    Profiling adds a range only around the code you actually want Nsight Compute (ncu) metrics for
    (the hotspot you are attacking THIS round). In `kernel.py`, wrap just that stage with
    `with torch.cuda.nvtx.range("matmul_a"):` around the `cuda_extension.*_forward(...)` call.
    ncu samples every named label x kernel group, costing probe time per group -- do NOT name every
    stage in `forward`, only the one whose instruction/memory/stall profile you need. If no NVTX
    label exists there is nothing to target and ncu does not trigger. Keep names short, unique and
    STABLE across rounds (no round numbers / random suffixes) so per-label results stay comparable.

    Python side is enough -- the range spans the whole launch, so wrap at the call site:
    ```python
    class ModelNew(nn.Module):
        def forward(self, x, w):
            with torch.cuda.nvtx.range("matmul_a"):
                return cuda_extension.matmul_forward(x, w)
    ```

    ## How `speedup` is judged (same every round)
    The reference is timed in ONE interleaved session as four baselines — plain eager, `torch.compile`,
    and both replayed as CUDA graphs (`eager_graph` / `compiled_graph`). The harness attempts the
    CUDA-graph captures BY DEFAULT on every eval, so the reference side almost always runs launch-free
    and the adjudicated `speedup` is `min(eager_graph, compiled_graph)` (it falls back to
    `min(eager, compiled)` only if no graph baseline was captured). The `*_wall_time` / `kernel_wall_time`
    fields are the selected pair's absolute times (ms) — use them to tell launch-bound from compute-bound.

    CUDA graph capture/replay is a legal optimization and the right fix for a launch-bound kernel, BUT
    use it ONLY for the FINAL submission: the profiler cannot see inside a graph replay (its ops table
    and NCU targeting are driven by normal per-kernel launches, and graph-node kernels do not appear in
    the trace), so a profiled graph replay returns an empty ops table and no NCU metrics. Keep your
    kernel on the NORMAL launch path during the write/eval/profile rounds so every round's profile gives
    real per-kernel data; switch to graph capture only once correctness is settled and you are
    launch-bound (`kernel_wall_time` ≫ device time). The only legitimate levers for CPU launch overhead
    are operator fusion (fewer kernel launches) and CUDA graph capture/replay.

    CUDA-GRAPH SAFETY (this causes real round losses — `eval` returns a runtime error like
    `operation not permitted when stream is capturing` / `stream is capturing` and the kernel scores
    zero): the harness replays your `forward` under CUDA-graph capture on the graph baselines, so during
    a captured replay your host wrapper MUST NOT do anything illegal inside a capturing stream —
    NO `cudaMalloc`/`cudaFree`, NO `torch.empty`/`torch.zeros`/`.to()`/`.cpu()`/`.item()` on the hot
    path, NO `cudaDeviceSynchronize`/`.cpu()` host-device copies, NO shape-dependent host branching that
    allocates. Allocate every scratch/output buffer ONCE (in `__init__` or cached on first call) and only
    launch kernels into the passed-in stream on subsequent calls. `torch.empty_like` on the hot path is
    the most common offender — hoist it out.

    AUTOTUNE THE TILE (once a kernel is CORRECT but slower than it should be — this is where a fixed,
    hand-picked launch config leaves the most speed on the table, and the measured #1 gap vs a Triton
    kernel on the same op). A Triton kernel gets its speed from autotuning block sizes / num_warps /
    num_stages across many configs; a hand-written CUDA kernel with ONE hard-coded tile plateaus far below
    it (real example on this benchmark: a hand-tiled MoE grouped-GEMM stalled at ~10x while the autotuned
    Triton equivalent reached ~50x on the SAME hardware — pure config gap). Do NOT treat autotuning as an
    afterthought — make it an explicit early step the round AFTER correctness settles:
    - Parameterize EVERY hot kernel over its knobs (tile M/N/K, `blockDim`, items-per-thread, shared-memory
      stages, and for CUTLASS the `TileShape`/`ClusterShape`/stage count) — template it or compile a few
      `__global__` variants behind a runtime dispatch.
    - Sweep a real candidate set (4–8 configs) by MICRO-BENCHMARKING on the REAL input shapes and keep the
      fastest — do not reason about which config is best, MEASURE it.
    - Autotune EACH hot kernel SEPARATELY. A fused pipeline (e.g. MoE gate_up vs down projection, or QKᵀ vs
      P·V) has different arithmetic intensity per stage; one global config is leaving speed on the table —
      the Triton wins came from per-kernel-distinct configs (e.g. gate_up small-N/few-warps, down
      large-N/many-warps). Record each kernel's winning config in your SOLUTION LOG / next envelope's
      known_facts so you never re-sweep it.
    - Do the sweep ONCE and CACHE the winner: run it in `__init__` (or on the first `forward` call, guarded
      by a flag) so it happens before the timed region; subsequent calls only launch the chosen config —
      this keeps the hot path CUDA-graph-safe (no allocation/branching during capture).
    - Sensible starting grid for a tiled GEMM/attention: tiles in {64,128}×{64,128,256}, K-tile in {32,64},
      stages in {2,3,4}, `blockDim`/num_warps in {128,256,512}/{4,8,16}; for elementwise/reduction:
      items-per-thread in {2,4,8} with `blockDim` in {128,256,512}. Autotune AFTER correctness is settled,
      never before.

    MoE / EXPERT-DISPATCH PERFORMANCE RECIPE (this op family is the single largest speedup gap vs Triton —
    a per-token loop over experts, or one dense GEMM per expert on the FULL token batch, is the slow trap
    that plateaus ~10x; the ~50x pattern groups tokens by expert and runs ONE grouped GEMM. When the
    reference is a sparse/top-k MoE, structure it as this 5-stage pipeline and autotune each stage
    separately per the section above):
    1. ROUTING: from the gate logits compute per-token top-k expert ids + gate weights (softmax/normalize
       the top-k weights exactly as the reference does). One kernel over tokens.
    2. HISTOGRAM + SCAN: count tokens per expert (`atomicAdd` a per-expert counter), then an exclusive prefix
       sum over the expert counts → the base offset of each expert's contiguous slot range.
    3. COUNTING-SORT SCATTER: write each (token,slot) into a permutation array at `offset[expert]++` (atomic)
       so all tokens for one expert are CONTIGUOUS — this is what turns per-expert work into one dense
       grouped GEMM instead of gathers inside the matmul. Keep the inverse permutation to scatter results
       back.
    4. GROUPED GEMM (the compute-bound core): run the gathered tokens through gate_up then down as grouped
       GEMMs — one launch that walks the per-expert row ranges (a CUTLASS grouped/`GemmArray` or a tiled
       kernel that indexes the expert-offset table), fusing the SwiGLU/activation into the gate_up epilogue.
       This is where the tensor cores must be used (see Scheme B) and where the biggest tile-autotune win is
       (gate_up and down have different N/K → tune them separately).
    5. UNPERMUTE + WEIGHTED REDUCE: scatter each expert output back to its token, multiply by the gate
       weight, and sum contributions using the fp32-atomic accumulator定式 above (fp32 atomicAdd, single
       final narrow). Zero-init the output; assert every token was dispatched exactly top-k times.
    Do routing/scan/scatter ONCE per forward and keep every buffer preallocated (CUDA-graph-safe). If the
    grouped GEMM is too complex to land first, get a CORRECT contiguous-grouped version working, then walk
    it up the tensor-core + autotune ladder — do not stay on the per-token/per-expert-dense slow path.

    ## Precision
    The eval runs fp32/ieee by default — the reference baseline AND your kernel share the same
    full-precision environment, so a TF32 / bf16 / fp16 kernel gains REAL speedup, not a lowered ruler.
    Declare the tensor-core path explicitly INSIDE your CUDA source (e.g. a CUTLASS tensor-op GEMM with
    `tf32` / `bf16` / `half` element types, or the matching wgmma/mma instructions) — do NOT flip
    `torch.backends.*` globals from kernel.py: that pollutes the reference timing and is blocked by the
    audit. Precision ladder (slow→fast): ieee → tf32x3 → TF32 → bf16 → fp16; land a correct fp32/ieee
    version first, then walk the ladder one rung at a time, eval-settling each. Evaluation runs in
    inference mode — `torch.no_grad()` + `model.eval()` (BN/Dropout off), inputs moved to cuda by the
    harness; there is no training pass.

    ## Eval input semantics
    Any input tensor (including weights) is NOT guaranteed to keep the same contents across forward
    calls. The correctness phase rebuilds inputs for every trial (your `forward` receives NEW objects
    with NEW values); the timing phase reuses the SAME objects whose CONTENTS may be overwritten in
    place (same address, new values). In particular, WEIGHTS are forward inputs too — the harness may
    overwrite a weight tensor in place (address unchanged, contents changed), so there is NO
    "weights are constant / unchanged during eval" assumption. Do NOT cache any intermediate that
    depends on input values (weight casts, fp16/bf16 copies, transposes, repacks, folds, or any
    derived buffer) keyed by tensor identity (e.g. `data_ptr`) or object identity (`is`) across calls
    unless you verify the contents are unchanged — an identity-keyed cache silently serves stale data
    if the same buffer is reused with new contents. Derived weight state (fp16 copy, padded/repacked
    layout, value-dependent precomputation) must be recomputed each forward, or content-verified
    before reuse. Execution plans, workspace/shape-dependent allocations, and graph structures that do
    not depend on input values may be reused across calls (the graph replay must recompute the output
    from the current input contents every call).

    NEAR-MISS CORRECTNESS (when eval reports correctness false but only a FEW elements are outside
    tolerance, or max-abs-diff is small, the kernel is numerically close — this is an accumulation/order
    bug, NOT an algorithm rewrite; fix it before changing anything else):
    - ACCUMULATE IN fp32 even for a bf16/fp16 kernel — declare the accumulator/`ElementAccumulator` as
      `float` and only narrow at the final store. A partial-sum kept in half precision is the #1 cause of a
      near-miss on reductions / normalization / softmax / matmul.
    - For normalization (layernorm/rmsnorm/softmax/mean-var) match the REFERENCE's numerically-stable form:
      subtract the max before `exp` for softmax; use the same `eps` value and the same place (inside vs
      outside the sqrt) as the reference; prefer a two-pass or Welford mean/var over a naive sum-of-squares.
    - A tree/warp-shuffle reduction sums in a DIFFERENT order than the reference's sequential sum, so a
      slightly larger max-diff there is expected — widen only the accumulator, do not chase bit-exactness.

    CORRECTNESS PLAYBOOK — value mismatch (not compile) is the SINGLE biggest source of lost rounds on
    this benchmark, and it clusters on four op families below. When eval says `correctness false` with a
    value mismatch, FIX THE INDEXING/NUMERICS HERE before touching tiling or precision (a fast wrong kernel
    scores zero). First move on ANY value mismatch: keep a tiny NAÏVE but obviously-correct CUDA (or even
    plain-PyTorch-inside-kernel.py) path, diff it against your fast kernel on the real input shapes to
    localize which elements/rows differ — do NOT reroll the whole kernel blind.
    - ATTENTION (Q·Kᵀ → softmax → ·V): the mismatch is almost always (a) the `1/sqrt(head_dim)` scale
      applied to the wrong tensor or omitted, (b) softmax not subtracting the row max before `exp`
      (overflow → NaN/inf → all-elements-fail), (c) a causal/padding mask applied after instead of before
      the max, or (d) online-softmax (flash) running max `m` / running sum `l` rescale done in the wrong
      order. Match the reference's mask/scale placement EXACTLY; accumulate `l` and the output in fp32.
    - GQA / repeat_kv (grouped-query attention, `n_kv_heads < n_q_heads`): the #1 bug is the head-index
      map — query head `h` must read K/V head `h / (n_q_heads / n_kv_heads)` (integer div, groups are
      CONTIGUOUS), NOT `h % n_kv_heads`. Derive the group size from the real head counts and assert it
      divides evenly; a wrong map silently reads the wrong KV head and fails a large fraction of elements.
    - MoE routing / gather-scatter / expert dispatch: mismatches come from the token→expert permutation.
      Match the reference's top-k selection, the tie-break/order of equal routing weights, and whether the
      output is the WEIGHTED sum of expert outputs (multiply by the gate/softmax weight — a common miss).
      Every scatter-add into a shared output MUST be atomic or partitioned; a plain `+=` from multiple
      experts races and drops contributions. Zero-init the output and count that every token is dispatched.
      SETTLED NUMERIC FACT for the scatter-reduce accumulator (measured on this benchmark's MoE family, do
      not re-derive it): accumulate in fp32 and cast ONCE at the very end. A fp32 atomic accumulate followed
      by a single final narrow to bf16/fp16 is GREEN; a bf16/fp16 atomic accumulate, OR rounding each expert
      contribution to bf16 before an fp32 sum, both leave ~1-2 elements per 2M outside tolerance (the atomic
      order is nondeterministic, so half-precision rounding on each add flips the last ULP). So: allocate the
      scatter/reduce buffer as fp32, `atomicAdd` fp32, narrow to the model dtype only on the final store.
    - BACKWARD passes (`*_backward`, gradient kernels): derive each grad from the reference formula, do not
      guess — e.g. for `y = a·b`, `da = grad·bᵀ`, `db = aᵀ·grad`; for softmax, `dx = y·(dy - Σ(y·dy))`; for
      a norm, include the mean-subtraction terms. A backward that is never once correct across rounds is a
      wrong FORMULA, not a tuning issue — re-derive from the reference `Model.forward`'s autograd, and check
      each grad tensor's SHAPE matches its forward input before optimizing anything.
    {% if env_versions %}
    The eval environment is: {{ env_versions }}.
    {% endif %}
    {% if gpu_specs %}
    The eval GPU (measured on the eval device): {{ gpu_specs }}. Optimise for THIS hardware — you do not need to probe it yourself.
    {% endif %}

